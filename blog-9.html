<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何も上手くいかない - My Diary</title>
    <link rel="stylesheet" href="blog-css.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📔 My Diary</h1>
            <p>日々の記録</p>
            
            <div class="search-container">
                <form class="search-form" id="search-form">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="search-input" 
                        placeholder="キーワードで検索... (2語まで対応)" 
                        autocomplete="off"
                    />
                    <button type="submit" class="search-button">🔍 検索</button>
                </form>
                <div class="search-message" id="search-message"></div>
            </div>
        </header>

        <!-- パンくずリスト -->
        <nav class="breadcrumb">
            <a href="top.html">トップ</a>
            <span class="breadcrumb-separator">›</span>
            <span class="breadcrumb-current">何も上手くいかない</span>
        </nav>

        <!-- 検索結果表示エリア（ここに挿入されます） -->
        <div id="search-result-placeholder"></div>

        <!-- 記事本文 -->
        <article class="article-detail">
            <div class="entry-date-header">
                <div class="date-box">
                    <div class="date-day">10月</div>
                </div>
                <div>
                    <div class="date-info-group">
                        <div class="date-label">最終更新:</div>
                        <div class="date-time">15日前</div>
                    </div>
                </div>
            </div>
            
            <div class="entry-content">
                <h1 class="article-title">何も上手くいかない</h1>
                
                <div class="article-body">
                    <p>
                    就活、全然うまくいかない。
                    書類は落ちるし、面接も手応えがあったと思ったところほど連絡が来ない。
                    <span style="color: white;">触</span> だんだん不安になってきて、「やっぱり俺がおかしいのか？」という考えが頭をよぎる。
                    でも、冷静に振り返ると、<span style="color: white;">っ</span>変なことはしていないはずなんだ。
                    言われた通りに準備して、対策して、無難に受け答えしている。
                    なのに結果だけがついてこない。
                    一体なんなんだ。
                    どうして俺は“正しい”ことをしているのに、みんな<span style="color: white;">て</span>、世間は俺を受け入れないんだろう。

                    </p>

                </div>
            </div>
        </article>
        <!-- トップに戻るボタン -->
        <div class="back-to-top">
            <a href="top.html" class="back-button">← トップページに戻る</a>
        </div>

    </div>

    <script src="blog-js.js"></script>

</html>
