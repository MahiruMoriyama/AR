<!DOCTYPE html>
<html lang="ja">
<head>

    <link rel="stylesheet" href="blog-css.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📔 My Diary</h1>
            <p>日々の記録</p>
            
            <div class="search-container">
                <form class="search-form" id="search-form">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="search-input" 
                        placeholder="キーワードで検索... (2語まで対応)" 
                        autocomplete="off"
                    />
                    <button type="submit" class="search-button">🔍 検索</button>
                </form>
                <div class="search-message" id="search-message"></div>
            </div>
        </header>

        <!-- パンくずリスト -->
        <nav class="breadcrumb">
            <a href="top.html">トップ</a>
            <span class="breadcrumb-separator">›</span>
            <span class="breadcrumb-current">調査してみた</span>
        </nav>

        <!-- 検索結果表示エリア（ここに挿入されます） -->
        <div id="search-result-placeholder"></div>

        <!-- 記事本文 -->
        <article class="article-detail">
            <div class="entry-date-header">
                <div class="date-box">
                    <div class="date-day">7月</div>
                </div>
                <div>
                    <div class="date-info-group">
                        <div class="date-label">最終更新:</div>
                        <div class="date-time">15日前</div>
                    </div>
                </div>
            </div>
            
            <div class="entry-content">
                <h1 class="article-title">調査してみた</h1>
                
                <div class="article-body">
                    <p>
                    恋愛マニュアルを読み進めていくと、タクティカルシートなるものを記入することに。
                    </p>
                    <p>
                    というわけで、ネットを見たり、相手のSNSでの過去の発言を拾ったりして、色々と調べてみた。<br>
                    好きなものとか、傾向とか、そういう細かいところまで。<br>
                    そうやって調べまくっていたら相手のタクティカルシートが全て埋まった。<br>
                    一旦はこれでいいだろう。<br>
                    <img src="恋愛プロファイルシート.png" class="header-image">
                    </p>

                </div>
            </div>
        </article>
        <!-- トップに戻るボタン -->
        <div class="back-to-top">
            <a href="top.html" class="back-button">← トップページに戻る</a>
        </div>
