<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ずぅーっと一緒になるには - 観察記録</title>
    <link rel="stylesheet" href="dark-style-css.css">
    <link rel="stylesheet" href="dark-article-css.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👁️ 観察記録</h1>
            <p>あなたのすべてを知っている</p>
            
            <div class="search-container">
                <form class="search-form" id="search-form">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="search-input" 
                        placeholder="あなたを探す... (2語まで対応)" 
                        autocomplete="off"
                    />
                    <button type="submit" class="search-button">🔍 追跡</button>
                </form>
                <div class="search-message" id="search-message"></div>
            </div>
        </header>

        <!-- パンくずリスト -->
        <nav class="breadcrumb">
            <a href="dark-blog.html">観察記録トップ</a>
            <span class="breadcrumb-separator">›</span>
            <span class="breadcrumb-current">楽しみだなあ</span>
        </nav>

        <!-- 検索結果表示エリア（ここに挿入されます） -->
        <div id="search-result-placeholder"></div>

        <!-- 記事本文 -->
        <article class="article-detail">
            <div class="entry-date-header">
                <div class="date-box">
                    <div class="date-day">さんぽめ</div>
                </div>
                <div>
                    <div class="date-info-group">
                        <div class="date-label">投稿:</div>
                        <div class="date-time">21日前</div>
                    </div>
                    <div class="date-info-group">
                        <div class="date-label">最終更新:</div>
                        <div class="date-time">15日前</div>
                    </div>
                </div>
            </div>
            
            <div class="entry-content">
                <h1 class="article-title">楽しみだなあ</h1>
                
                <div class="article-body">
                    <p>
                        接近方法について調べている。<br>
                        <a href="https://nonoharaarea.shop/lovehack.html">この記事</a>の中では、「偶然の出会い」を装うのが効果的だと書かれていた。<br>
                    </p>
                        <p>
                        さてと....じゃあこの偶然を演出するために....<br>
                        陽介が今、何に悩んでいるのか。<br>
                        どんな場所に安心を感じるのか。<br>
                        立ち寄りがちな場所はどこか。<br>
                        色々と調査する必要がありそうだ。<br>

                        偶然は、準備された人間の前にだけ現れるらしい。
                    </p>
                </div>
                
            </div>
        </article>

        <!-- トップに戻るボタン -->
        <div class="back-to-top">
            <a href="dark-top.html" class="back-button">← トップに戻る</a>
        </div>

    </div>

    <script src="blog-js.js"></script>

</html>
