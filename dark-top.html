<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>観察記録</title>
    <link rel="stylesheet" href="dark-style-css.css">
</head>
<body>
    <div class="container">
        <header>
            <!-- メインビジュアル -->
            <div class="main-visual">
                <div class="visual-content">
                    <div class="visual-icon">👁️</div>
                    <div class="visual-text">WATCHING YOU</div>
                </div>
            </div>

            <h1>👁️ 観察記録</h1>
            <p>あなたのすべてを知っている</p>
            
            <div class="search-container">
                <form class="search-form" id="search-form">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="search-input" 
                        placeholder="あなたを探す... (2語まで対応)" 
                        autocomplete="off"
                    />
                    <button type="submit" class="search-button">🔍 追跡</button>
                </form>
                <div class="search-message" id="search-message"></div>
            </div>
        </header>

        <article class="diary-entry">
            <div class="entry-date-header">
                <div class="date-box">
                    <div class="date-day">いっぽめ</div>
                </div>
                <div>
                    <div class="date-info-compact">
                        <span class="date-label-compact">投稿:</span>
                        <span class="date-relative">23日前</span>
                    </div>
                    <div class="date-info-compact">
                        <span class="date-label-compact">最終更新:</span>
                        <span class="date-relative">15日前</span>
                    </div>
                </div>
            </div>
            <div class="entry-content">
                <h2 class="entry-title">ずぅーっと一緒に</h2>
                <p class="entry-text">
                    今日は「一生一緒になる方法」について調べていた。運命的な出会いをして、自然な流れで一緒に生活を始めよう。
                </p>
                <a href="dark-blog-1.html" class="read-more-btn">続きを読む →</a>
            </div>
        </article>
    </div>
    <script src="blog-js.js"></script>
</body>
</html>
