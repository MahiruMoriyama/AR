<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>君の生活圏 - 観察記録</title>
    <link rel="stylesheet" href="dark-style-css.css">
    <link rel="stylesheet" href="dark-article-css.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👁️ 観察記録</h1>
            <p>あなたのすべてを知っている</p>
            
            <div class="search-container">
                <form class="search-form" id="search-form">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="search-input" 
                        placeholder="あなたを探す... (2語まで対応)" 
                        autocomplete="off"
                    />
                    <button type="submit" class="search-button">🔍 追跡</button>
                </form>
                <div class="search-message" id="search-message"></div>
            </div>
        </header>

        <!-- パンくずリスト -->
        <nav class="breadcrumb">
            <a href="dark-top.html">観察記録トップ</a>
            <span class="breadcrumb-separator">›</span>
            <span class="breadcrumb-current">君の生活圏</span>
        </nav>

        <!-- 検索結果表示エリア（ここに挿入されます） -->
        <div id="search-result-placeholder"></div>

        <!-- 記事本文 -->
        <article class="article-detail">
            <div class="entry-date-header">
                <div class="date-box">
                    <div class="date-day">ろっぽめ</div>
                </div>
                <div>
                    <div class="date-info-group">
                        <div class="date-label">投稿:</div>
                        <div class="date-time">18日前</div>
                    </div>
                    <div class="date-info-group">
                        <div class="date-label">最終更新:</div>
                        <div class="date-time">15日前</div>
                    </div>
                </div>
            </div>
            
            <div class="entry-content">
                <h1 class="article-title">君の生活圏</h1>
                
                <div class="article-body">
                    <p>
                        主人公の最寄り駅を中心に、地図をなぞってみる。<br>
                        中古品ショップを見つけた。<br>

                        ここで働けば、いつか主人公と会えるかもしれない。<br>
                        そんな考えが、ふと頭をよぎる。<br>

                        さあ、思い立ったら早速行動だ！<br>
                        待っててね愛する人.....💛<br>
                        あと少しで運命的な出会いが出来るね.....💛
                        <img src = "soft-on外観.png">
                    </p>
                </div>
                
            </div>
        </article>

        <!-- トップに戻るボタン -->
        <div class="back-to-top">
            <a href="dark-top.html" class="back-button">← トップに戻る</a>
        </div>

    </div>

    <script src="blog-js.js"></script>
    <div><p style="color: white;">ページ 19/24</p></div>
